name: Catalog Harvester (BİM · A101 · ŞOK)

on:
  schedule:
    # GitHub cron is UTC. Every 3h at :17 (off-peak minute → fewer delayed runs).
    # = 03:17, 06:17, 09:17 … Istanbul time — catches Tue/Thu/Fri catalog drops within hours.
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      stores:
        description: 'Stores (comma list)'
        default: 'bim,a101,sok'

permissions:
  contents: write

concurrency:            # never run two harvests at once (avoids push races)
  group: catalog-harvester
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest tests.test_harvester

      - name: Harvest
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          FLAGS=""
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then FLAGS="--firestore --notify"; fi
          python -m harvester --stores "${{ github.event.inputs.stores || 'bim,a101,sok' }}" $FLAGS

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add offers.json catalogs.json
          if git diff --staged --quiet; then
            echo "No catalog changes."
          else
            git commit -m "chore(catalogs): auto-update $(date -u +'%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase --autostash
            git push
          fi
